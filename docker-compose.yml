# Slim development stack: the backend (with its embedded KùzuDB) and the
# workbench UI. The Celery worker module exists, but Redis is not deployed and
# the worker opens KùzuDB independently; keep it disabled until writes have a
# single owner. SearXNG is external and configured through SEARXNG_URL.

services:
  kuzuwiki-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kuzuwiki-backend
    restart: unless-stopped
    environment:
      KUZU_DB_PATH: /data/kuzudb/graph.kuzu
      WIKI_VAULT_PATH: /data/wiki
      RAW_VAULT_PATH: /data/raw_vault
      QUARANTINE_PATH: /data/quarantine
      PROJECT_DATA_ROOT: /data/projects
      DOMAIN_SCHEMA_PATH: /config/domain_schemas
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    env_file:
      - path: backend/.env
        required: false
    volumes:
      # Bind mounts, not named volumes: the wiki vault is meant to be
      # Git-versioned (ARCHIT.md), which a named volume would hide.
      - ./data/kuzudb:/data/kuzudb
      - ./data/wiki:/data/wiki
      - ./data/raw_vault:/data/raw_vault
      - ./data/quarantine:/data/quarantine
      - ./data/projects:/data/projects
      - ./config/domain_schemas:/config/domain_schemas:ro
      # Source code mount for live development (edits without rebuild)
      - ./backend/kuzuwiki:/app/kuzuwiki:rw
    # Backend stays on the private Compose network. The frontend Nginx proxies
    # /api and /ws internally; publishing this port on the host would collide
    # with other VPS services and bypass that single entry point.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  kuzuwiki-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Relative base URL: nginx proxies /api to the backend, so the bundle
        # does not need to know which host the browser is talking to.
        VITE_API_BASE_URL: /api/v1
        VITE_WS_URL: /ws
    container_name: kuzuwiki-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      kuzuwiki-backend:
        condition: service_healthy
