# Slim development stack: the backend (with its embedded KùzuDB) and the
# workbench UI. Services that have no implementation yet - the Celery worker
# (backend/app/agents/worker.py does not exist), SearXNG (no config shipped)
# and Redis (no broker in the codebase) - are deliberately not declared, so
# `docker compose up` starts a stack that actually works.

services:
  kuzuwiki-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kuzuwiki-backend
    restart: unless-stopped
    environment:
      KUZU_DB_PATH: /data/kuzudb/graph.kuzu
      WIKI_VAULT_PATH: /data/wiki
      RAW_VAULT_PATH: /data/raw_vault
      DOMAIN_SCHEMA_PATH: /config/domain_schemas
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    env_file:
      - path: backend/.env
        required: false
    volumes:
      # Bind mounts, not named volumes: the wiki vault is meant to be
      # Git-versioned (ARCHIT.md), which a named volume would hide.
      - ./data/kuzudb:/data/kuzudb
      - ./data/wiki:/data/wiki
      - ./data/raw_vault:/data/raw_vault
      - ./data/quarantine:/data/quarantine
      - ./config/domain_schemas:/config/domain_schemas:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  kuzuwiki-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Relative base URL: nginx proxies /api to the backend, so the bundle
        # does not need to know which host the browser is talking to.
        VITE_API_BASE_URL: /api/v1
        VITE_WS_URL: /ws
    container_name: kuzuwiki-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      kuzuwiki-backend:
        condition: service_healthy
